name: class_01 git actions
on:
 push:
jobs:
 job1:
  name: JOB1
  runs-on: ubuntu-latest
  steps:
    - name: Step-1
      run: |
         pwd
         ls -ltr
         hostname
    - name: Step-2-Checkout
      uses: actions/checkout@v5.0.1
    - name: Step-3
      run: |
         echo `pwd` >> myartifact.txt
         ls -ltr
         hostname
    - name: Upload single file
      uses:  actions/upload-artifact@v7.0.2
      with:
        name: single file
        path: ./myartifact.txt
